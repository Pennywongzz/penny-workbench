<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Penny工作台">
<link rel="icon" type="image/png" href="panda_avatar.png">
<link rel="apple-touch-icon" href="panda_avatar.png">
<title>Penny 的工作台</title>
<style>
:root {
  --primary: #7A9A5E; --primary-light: #9BB883; --primary-dark: #5A7A3E;
  --accent: #D4A574; --accent-light: #E8CAA0;
  --bg: #F7F9F4; --card-bg: #FFFFFF; --text: #2D2D2D;
  --text-light: #999; --text-mid: #666; --border: #E2E8DD;
  --success: #52A775; --warning: #E8A838; --danger: #E07060; --info: #6B9E8A;
  --radius: 12px; --shadow: 0 1px 10px rgba(122,154,94,0.08); --shadow-lg: 0 4px 24px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; }
button { cursor:pointer; font-family:inherit; border:none; }
input,select,textarea { font-family:inherit; font-size:14px; }
a { color:var(--primary); text-decoration:none; }

.app { display:flex; flex-direction:column; min-height:100vh; }

/* 顶部栏 */
.topbar {
  background:var(--card-bg); padding:12px 16px; display:flex;
  justify-content:space-between; align-items:center;
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50;
}
.topbar-left { display:flex; align-items:center; gap:8px; }
.topbar-logo { width:30px; height:30px; border-radius:50%; object-fit:cover; }
.topbar-title { font-size:17px; font-weight:700; color:var(--primary); }
.topbar-date { color:var(--text-light); font-size:12px; }
.btn-export, .btn-import {
  padding:6px 14px; border-radius:8px; font-size:13px; font-weight:600;
  cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; gap:4px;
  background:#fff; border:1.5px solid var(--border);
}
.btn-export { color:var(--primary); }
.btn-export:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-import { color:var(--accent); }
.btn-import:hover { background:var(--accent); color:#fff; border-color:var(--accent); }

/* 底部导航 */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  background:#fff; border-top:1px solid var(--border);
  display:flex; justify-content:space-around; align-items:center;
  padding:10px 0; padding-bottom:max(14px, env(safe-area-inset-bottom));
  box-shadow:0 -2px 16px rgba(0,0,0,0.06);
}
.nav-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 2px; cursor:pointer; transition:all 0.2s;
  color:var(--text-light); font-size:10px; font-weight:400;
  position:relative; max-width:72px;
}
.nav-item .nav-icon { font-size:20px; line-height:1; transition:all 0.2s; }
.nav-item .nav-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.nav-item.active { color:var(--primary); font-weight:600; }
.nav-item.active::before {
  content:''; position:absolute; top:0; left:20%; right:20%; height:2.5px;
  background:var(--primary); border-radius:0 0 3px 3px;
}

/* 左侧弹出导航 */
.sidebar-mask { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.35); z-index:150; }
.sidebar-mask.show { display:block; }
.sidebar {
  position:fixed; top:0;left:-260px; bottom:0; z-index:151;
  width:260px; max-width:80vw; background:#fff; box-shadow:2px 0 20px rgba(0,0,0,0.1);
  transition:left 0.25s ease; display:flex; flex-direction:column;
}
.sidebar.open { left:0; }
.sidebar-header {
  padding:24px 20px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
}
.sidebar-avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; }
.sidebar-name { font-size:17px; font-weight:700; color:var(--primary); }
.sidebar-menu { flex:1; overflow-y:auto; padding:8px 0; }
.sidebar-item {
  display:flex; align-items:center; gap:12px;
  padding:14px 24px; cursor:pointer; transition:background 0.15s;
  color:var(--text-mid); font-size:15px;
}
.sidebar-item:hover { background:#f8f6f3; }
.sidebar-item.active { background:#EDF3E8; color:var(--primary); font-weight:600; }
.sidebar-item .s-icon { font-size:20px; width:28px; text-align:center; }
.sidebar-item .s-label { flex:1; }
.sidebar-item .s-badge { font-size:11px; color:var(--text-light); }
.avatar-btn { background:none; border:none; padding:0; cursor:pointer; display:flex; align-items:center; }

/* 内容区 */
.main { flex:1; padding-bottom:85px; }
.content { padding:16px 16px 8px; max-width:1200px; margin:0 auto; }

.section { display:none; }
.section.active { display:block; }

.card { background:var(--card-bg); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:20px; }
.card-title { font-size:16px; font-weight:600; color:var(--text); margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; }

.btn { padding:8px 18px; border-radius:8px; font-size:13px; font-weight:500; transition:all 0.2s; display:inline-flex; align-items:center; gap:6px; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-dark); }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text-mid); }
.btn-outline:hover { border-color:var(--primary); color:var(--primary); }
.btn-danger { background:#fff0ee; color:var(--danger); }
.btn-danger:hover { background:#ffe0db; }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-success { background:#e8f5ee; color:var(--success); }
.btn-success:hover { background:#d4ecd9; }
.btn-vine { background:#EDF3E8; color:var(--primary); }
.btn-vine:hover { background:#DCE8D4; }

.form-row { display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.form-group { flex:1; min-width:120px; }
.form-group label { display:block; font-size:12px; color:var(--text-mid); margin-bottom:4px; }
.form-group input,.form-group select,.form-group textarea {
  width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px;
  background:#fff; outline:none; transition:border 0.2s;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus { border-color:var(--primary); }
.form-group textarea { resize:vertical; min-height:60px; }

.modal-mask { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.4); z-index:200; justify-content:center; align-items:flex-start; padding-top:60px; }
.modal-mask.show { display:flex; }
.modal { background:#fff; border-radius:var(--radius); width:600px; max-width:94%; max-height:80vh; overflow-y:auto; box-shadow:var(--shadow-lg); }
.modal-header { padding:18px 24px; font-size:16px; font-weight:600; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-close { font-size:22px; color:var(--text-light); cursor:pointer; background:none; }
.modal-body { padding:20px 24px; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }

table { width:100%; border-collapse:collapse; }
th { text-align:left; padding:10px 12px; font-size:12px; color:var(--text-mid); border-bottom:2px solid var(--border); white-space:nowrap; }
td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; }
tr:hover td { background:#faf9f7; }

.tag { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:500; }
.tag-consult { background:#FFF3E0; color:#E89020; }
.tag-enrolled { background:#E8F5EE; color:var(--success); }
.tag-pending { background:#F0F0F0; color:var(--text-mid); }

.stat-grid { display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.stat-card { background:var(--card-bg); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); flex:1; min-width:150px; }
.stat-card .label { font-size:12px; color:var(--text-light); margin-bottom:6px; }
.stat-card .value { font-size:22px; font-weight:700; }
.stat-card .value.primary { color:var(--primary); }

.empty { text-align:center; padding:40px 20px; color:var(--text-light); }
.empty-icon { font-size:40px; margin-bottom:10px; }

.icon-btn { background:none; border:none; font-size:16px; cursor:pointer; padding:4px; opacity:0.5; transition:opacity 0.2s; }
.icon-btn:hover { opacity:1; }

/* 每日计划 */
.todo-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; transition:background 0.2s; }
.todo-item:hover { background:#faf9f7; }
.todo-check { width:20px;height:20px; border:2px solid var(--border); border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
.todo-check.done { background:var(--success); border-color:var(--success); }
.todo-check.done::after { content:"✓"; color:#fff; font-size:13px; }
.todo-text { flex:1; }
.todo-item.done .todo-text { text-decoration:line-through; color:var(--text-light); }
.todo-del { color:var(--text-light); font-size:14px; opacity:0; transition:opacity 0.2s; }
.todo-item:hover .todo-del { opacity:0.6; }

/* 英语学习 - 闪卡 */
.vocab-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
.flashcard {
  background:var(--card-bg); border-radius:10px; padding:16px 12px;
  box-shadow:var(--shadow); cursor:pointer; transition:all 0.25s;
  text-align:center; min-height:90px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; user-select:none;
  border:2px solid transparent;
}
.flashcard:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,0.1); }
.flashcard.flipped { border-color:var(--primary); background:#FAFBF7; }
.flashcard.learned { opacity:0.5; border-color:var(--success); }
.flashcard .fc-word { font-weight:700; font-size:14px; color:var(--text); transition:all 0.2s; }
.flashcard.flipped .fc-word { color:var(--primary); }
.flashcard .fc-reveal { display:none; font-size:12px; color:var(--text-mid); margin-top:6px; line-height:1.6; }
.flashcard.flipped .fc-reveal { display:block; }
.flashcard .fc-pron { color:var(--accent); font-size:12px; font-style:italic; }
.flashcard .fc-meaning { font-weight:600; color:var(--primary); font-size:13px; margin-top:2px; }
.flashcard .fc-example { color:var(--text-light); font-size:11px; margin-top:2px; }
.flashcard .fc-tags { display:flex; gap:4px; margin-top:6px; justify-content:center; }
.flashcard .fc-tag { font-size:10px; padding:2px 6px; border-radius:8px; }
.flashcard .fc-tag.travel { background:#f0f4ff; color:#5B8DBE; }
.flashcard .fc-tag.wine { background:#EDF3E8; color:var(--primary); }
.flashcard .fc-tag.learned-tag { background:#E8F5EE; color:var(--success); }

/* 日历 */
.calendar { background:var(--card-bg); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow); }
.cal-toggle {
  display:inline-flex; align-items:center; gap:6px; padding:6px 14px;
  background:var(--card-bg); border-radius:8px; box-shadow:var(--shadow);
  cursor:pointer; font-size:13px; color:var(--text-mid); margin-bottom:12px;
  user-select:none; transition:all 0.2s;
}
.cal-toggle:hover { background:#EDF3E8; color:var(--primary); }
.cal-toggle-icon { font-size:15px; }
.cal-toggle-arrow { font-size:11px; transition:transform 0.2s; }
.cal-toggle-arrow.open { transform:rotate(180deg); }
.cal-wrapper { margin-bottom:16px; }
.calendar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.calendar-header .cal-month { font-size:15px; font-weight:700; color:var(--primary); }
.calendar-header button { background:none; border:1px solid var(--border); border-radius:6px; padding:4px 10px; cursor:pointer; color:var(--text-mid); font-size:13px; }
.calendar-header button:hover { color:var(--primary); border-color:var(--primary); }
.calendar-weekdays { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--text-light); margin-bottom:6px; padding:0 2px; }
.calendar-days { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.calendar-day {
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:8px; cursor:pointer; font-size:13px; transition:all 0.15s; position:relative;
  color:var(--text); min-height:36px;
}
.calendar-day:hover { background:#f5f7f2; }
.calendar-day.other-month { color:#ddd; cursor:default; }
.calendar-day.today { background:var(--primary); color:#fff; font-weight:700; }
.calendar-day.today:hover { background:var(--primary-dark); }
.calendar-day.active-date { box-shadow:inset 0 0 0 2px var(--accent); }
.calendar-day.has-data::after {
  content:''; width:5px; height:5px; border-radius:50%; background:var(--accent);
  position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
}
.calendar-day.today.has-data::after { background:#fff; }

@media (max-width:480px) {
  .vocab-grid { grid-template-columns:repeat(2,1fr); }
  .calendar-day { font-size:11px; min-height:30px; }
}

.scene-card { background:var(--card-bg); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); margin-bottom:12px; }
.scene-card h4 { color:var(--primary); margin-bottom:10px; font-size:15px; }
.scene-card .dialogue { background:#f9f8f6; border-radius:8px; padding:12px; margin:8px 0; }
.scene-card .dialogue p { margin-bottom:6px; }
.scene-card .dialogue .speaker { font-weight:600; color:var(--primary); }

/* 资金管理 */
.asset-account { background:var(--card-bg); border-radius:10px; padding:14px 18px; box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.asset-account .acct-info { display:flex; align-items:center; gap:10px; }
.asset-account .acct-icon { font-size:24px; }
.asset-account .acct-name { font-weight:600; }
.asset-account .acct-type { font-size:12px; color:var(--text-light); }
.asset-account .acct-amount { font-weight:700; font-size:16px; }
.asset-account .acct-change { font-size:12px; margin-left:8px; }
.asset-account .acct-time { font-size:11px; color:var(--text-light); }

.fund-row td { font-size:13px; }
.profit-positive { color:var(--success); font-weight:600; }
.profit-negative { color:var(--danger); font-weight:600; }

/* 日记 */
.diary-entry { background:var(--card-bg); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); margin-bottom:12px; border-left:4px solid var(--primary); position:relative; }
.diary-entry .diary-date { font-size:13px; color:var(--primary); font-weight:600; margin-bottom:8px; }
.diary-entry .diary-delete { position:absolute; right:16px; top:16px; font-size:16px; cursor:pointer; opacity:0; transition:opacity 0.2s; background:none; border:none; color:var(--danger); }
.diary-entry:hover .diary-delete { opacity:0.7; }
.diary-entry .diary-delete:hover { opacity:1; }

/* 文案备忘 */
.copy-card { background:var(--card-bg); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); margin-bottom:12px; border-left:4px solid var(--warning); transition:opacity 0.3s; }
.copy-card.published { border-left-color:var(--border); opacity:0.55; }
.copy-card.published .copy-content { color:var(--text-mid); }
.copy-card .copy-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.copy-card .copy-type { font-size:12px; color:var(--accent); font-weight:600; }
.copy-card .copy-content { white-space:pre-wrap; font-size:14px; line-height:1.7; }
.copy-card .copy-actions { margin-top:10px; display:flex; gap:8px; }

/* 学员 */
.student-card { background:var(--card-bg); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); margin-bottom:12px; }
.student-card .stu-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.student-card .stu-name { font-size:16px; font-weight:700; }
.student-card .stu-info { display:flex; gap:20px; flex-wrap:wrap; font-size:13px; color:var(--text-mid); margin-bottom:8px; }
.student-card .stu-info span { display:flex; align-items:center; gap:4px; }
.student-card .stu-notes { font-size:13px; color:var(--text-mid); background:#f9f8f6; padding:8px 12px; border-radius:8px; margin-top:8px; }
.student-card .stu-actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }

.filter-bar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.filter-btn { padding:6px 14px; border-radius:20px; font-size:13px; background:#fff; border:1px solid var(--border); color:var(--text-mid); cursor:pointer; transition:all 0.2s; }
.filter-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }

/* 销售表格可滚动 */
.sales-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.sales-scroll table { min-width:1000px; }

@media (max-width:768px) {
  .topbar { padding:10px 12px; }
  .topbar-date { display:none; }
  .topbar-title { font-size:15px; }
  .content { padding:12px 12px 8px; }
  .form-row { flex-direction:column; }
  .form-group { min-width:100%; }
  .nav-item .nav-icon { font-size:18px; }
  .nav-item .nav-label { font-size:9px; }
}
</style>
</head>
<body>
<div id="error-display" style="display:none;background:#c00;color:#fff;padding:12px 16px;font-size:14px;position:fixed;top:0;left:0;right:0;z-index:99999;"></div>
<div class="app">

  <div class="bottom-nav">
    <div class="nav-item active" data-section="plan">
      <span class="nav-icon">✅</span><span class="nav-label">计划</span>
    </div>
    <div class="nav-item" data-section="english">
      <span class="nav-icon">📖</span><span class="nav-label">英语</span>
    </div>
    <div class="nav-item" data-section="diary">
      <span class="nav-icon">📝</span><span class="nav-label">日记</span>
    </div>
    <div class="nav-item" data-section="sales">
      <span class="nav-icon">📊</span><span class="nav-label">销售</span>
    </div>
    <div class="nav-item" data-section="students">
      <span class="nav-icon">🎓</span><span class="nav-label">学员</span>
    </div>
    <div class="nav-item" data-section="copywriting">
      <span class="nav-icon">✍️</span><span class="nav-label">文案</span>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="avatar-btn" onclick="toggleSidebar()" title="菜单">
          <img class="topbar-logo" src="panda_avatar.png" alt="Penny">
        </button>
        <span class="topbar-title" id="pageTitle">每日计划</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="topbar-date" id="topDate"></span>
        <div class="topbar-actions">
          <button class="btn-export" onclick="exportAllData()">↑ 导出</button>
          <button class="btn-import" onclick="document.getElementById('importFile').click()">↓ 导入</button>
        </div>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importAllData(event)">

    <!-- 左侧弹出导航 -->
    <div class="sidebar-mask" id="sidebarMask" onclick="closeSidebar()"></div>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img class="sidebar-avatar" src="panda_avatar.png" alt="Penny">
        <span class="sidebar-name">Penny</span>
      </div>
      <div class="sidebar-menu">
        <div class="sidebar-item" data-section="plan" >
          <span class="s-icon">✅</span><span class="s-label">每日计划</span>
        </div>
        <div class="sidebar-item" data-section="english" >
          <span class="s-icon">📖</span><span class="s-label">英语学习</span>
        </div>
        <div class="sidebar-item" data-section="diary" >
          <span class="s-icon">📝</span><span class="s-label">日记</span>
        </div>
        <div class="sidebar-item" data-section="sales" >
          <span class="s-icon">📊</span><span class="s-label">销售记录</span>
        </div>
        <div class="sidebar-item" data-section="students" >
          <span class="s-icon">🎓</span><span class="s-label">学员招生</span>
        </div>
        <div class="sidebar-item" data-section="copywriting" >
          <span class="s-icon">✍️</span><span class="s-label">文案备忘</span>
        </div>
        <div class="sidebar-item" data-section="finance" >
          <span class="s-icon">💰</span><span class="s-label">资金规划</span>
        </div>
      </div>
    </div>

    <div class="content">

      <!-- 1. 每日计划 -->
      <div class="section active" id="section-plan">
        <div class="cal-toggle" onclick="toggleCalendar('planCalWrap')">
          <span class="cal-toggle-icon">📅</span> 查看日历 <span class="cal-toggle-arrow" id="planCalArrow">▾</span>

<script>
// 调试：捕获 JS 错误并显示在页面上
window.onerror=function(msg,url,line){
  var el=document.getElementById('error-display');
  if(el){el.style.display='block';el.textContent='JS错误: '+msg+' (行'+line+')';}
  console.error('JS Error:',msg,'at line',line);
};
console.log('[DEBUG] Script started');
// ==================== 工具函数 ====================
const DB = {
  get(key, def) { try { const v=localStorage.getItem('pw_'+key); return v?JSON.parse(v):def; } catch { return def; } },
  set(key, val) { localStorage.setItem('pw_'+key, JSON.stringify(val)); }
};
function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) { if(!d) return ''; const dt=new Date(d); return `${dt.getMonth()+1}月${dt.getDate()}日`; }
function fmtMoney(n) { return '¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ==================== 全局状态变量（必须在所有函数之前声明，避免TDZ） ====================

// 切换模块
function switchToSection(sec) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('section-'+sec).classList.add('active');
  document.getElementById('pageTitle').textContent=sectionTitles[sec];
  syncNavActive(sec);
  if(sec==='plan') { renderTodos(); }
  if(sec==='english') renderVocab();
  if(sec==='diary') { renderDiary(); }
  if(sec==='sales') renderSales();
  if(sec==='students') renderStudents();
  if(sec==='finance') renderFinance();
  if(sec==='copywriting') renderCopywriting();
}
function syncNavActive(sec) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  var b=document.querySelector('.nav-item[data-section="'+sec+'"]');
  if(b) b.classList.add('active');
  document.querySelectorAll('.sidebar-item').forEach(n=>n.classList.remove('active'));
  var s=document.querySelector('.sidebar-item[data-section="'+sec+'"]');
  if(s) s.classList.add('active');
}
document.querySelectorAll('.nav-item').forEach(function(item){
  item.addEventListener('click',function(){switchToSection(item.dataset.section);});
});
document.querySelectorAll('.sidebar-item').forEach(function(item){
  item.addEventListener('click',function(){switchToSection(item.dataset.section);closeSidebar();});
});
function toggleSidebar(){
  var sb=document.getElementById('sidebar'),mask=document.getElementById('sidebarMask');
  if(sb.classList.contains('open')){closeSidebar();}
  else{sb.classList.add('open');mask.classList.add('show');}
}
function toggleCalendar(wrapId) {
  const wrap = document.getElementById(wrapId);
  const arrowId = wrapId === 'planCalWrap' ? 'planCalArrow' : 'diaryCalArrow';
  const arrow = document.getElementById(arrowId);
  if (wrap.style.display === 'none') {
    wrap.style.display = 'block';
    arrow.classList.add('open');
    if (wrapId === 'planCalWrap') renderPlanCalendar(); else renderDiaryCalendar();
  } else {
    wrap.style.display = 'none';
    arrow.classList.remove('open');
  }
}

function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarMask').classList.remove('show');}

syncNavActive('plan');
renderTodos();
function updateTopDate() {
  const d=new Date(), days=['日','一','二','三','四','五','六'];

}

// 模态框
function openModal(title,bodyHTML,footerHTML) {
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=bodyHTML;
  document.getElementById('modalFooter').innerHTML=footerHTML;
  document.getElementById('modalMask').classList.add('show');
}
function closeModal() { document.getElementById('modalMask').classList.remove('show'); }

// ==================== 1. 每日计划 ====================
function saveTodos() { DB.set('todos',todoData); renderPlanCalendar(); }
function changePlanDate(dir) {
  if(dir===0) currentPlanDate=todayStr();
  else { const d=new Date(currentPlanDate); d.setDate(d.getDate()+dir); currentPlanDate=d.toISOString().slice(0,10); }
  planCalendarDate=currentPlanDate;
  const y=parseInt(currentPlanDate.slice(0,4)), m=parseInt(currentPlanDate.slice(5,7));
  planCalMonth=y*100+m;
  renderPlanCalendar();
  renderTodos();
}
function addTodo() {
  const text=document.getElementById('todoInput').value.trim();
  if(!text) return;
  if(!todoData[currentPlanDate]) todoData[currentPlanDate]=[];
  todoData[currentPlanDate].push({id:uid(),text,done:false});
  document.getElementById('todoInput').value='';
  saveTodos(); renderTodos();
}
function toggleTodo(id) {
  const list=todoData[currentPlanDate]||[];
  const t=list.find(x=>x.id===id);
  if(t){t.done=!t.done;saveTodos();renderTodos();}
}
function deleteTodo(id) {
  todoData[currentPlanDate]=(todoData[currentPlanDate]||[]).filter(t=>t.id!==id);
  saveTodos(); renderTodos();
}
function renderTodos() {
  const isToday=currentPlanDate===todayStr();
  document.getElementById('planDateTitle').textContent=isToday?'今日计划':fmtDate(currentPlanDate)+' 计划';
  const list=todoData[currentPlanDate]||[];
  if(list.length===0) {
    document.getElementById('todoList').innerHTML='<div class="empty"><div class="empty-icon">✅</div>今天还没有计划，添加一些待办吧</div>';
    return;
  }
  document.getElementById('todoList').innerHTML=list.map(t=>`
    <div class="todo-item ${t.done?'done':''}">
      <div class="todo-check ${t.done?'done':''}" onclick="toggleTodo('${t.id}')"></div>
      <span class="todo-text">${t.text}</span>
      <button class="todo-del" onclick="deleteTodo('${t.id}')">✕</button>
    </div>`).join('');
}

function saveVocabProgress() { DB.set('vocabProgress', vocabProgress); }

function getTodayVocab() {
  const today=todayStr();
  if(!vocabProgress.dailyAssignments[today]) {
    const learned=new Set(vocabProgress.learnedWords);
    let travel=VOCAB_LIBRARY.filter(w=>w.type==='travel'&&!learned.has(w.word));
    let wine=VOCAB_LIBRARY.filter(w=>w.type==='wine'&&!learned.has(w.word));
    if(travel.length===0) {
      vocabProgress.learnedWords=vocabProgress.learnedWords.filter(n=>!VOCAB_LIBRARY.find(w=>w.word===n&&w.type==='travel'));
      travel=VOCAB_LIBRARY.filter(w=>w.type==='travel');
    }
    if(wine.length===0) {
      vocabProgress.learnedWords=vocabProgress.learnedWords.filter(n=>!VOCAB_LIBRARY.find(w=>w.word===n&&w.type==='wine'));
      wine=VOCAB_LIBRARY.filter(w=>w.type==='wine');
    }
    const todayWords=[...travel.slice(0,5),...wine.slice(0,3)];
    vocabProgress.dailyAssignments[today]=todayWords.map(w=>w.word);
    saveVocabProgress();
  }
  const wordNames=vocabProgress.dailyAssignments[today];
  return wordNames.map(name=>{
    const w=VOCAB_LIBRARY.find(v=>v.word===name);
    return w?{...w,learned:vocabProgress.learnedWords.includes(name)}:null;
  }).filter(Boolean);
}

function toggleFlashcard(word) {
  if(flippedCards[word]) { delete flippedCards[word]; }
  else {
    flippedCards[word]=true;
    // 朗读单词
    if('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(word);
      u.lang='en-US'; u.rate=0.85;
      window.speechSynthesis.speak(u);
    }
  }
  renderVocab();
}

function markVocabLearned(word) {
  if(!vocabProgress.learnedWords.includes(word)) {
    vocabProgress.learnedWords.push(word);
    saveVocabProgress();
  }
  renderVocab();
}

function renderVocab() {
  const vocab=getTodayVocab();
  if(vocab.length===0) {
    document.getElementById('vocabGrid').innerHTML='<div class="empty"><div class="empty-icon">📖</div>暂无词汇</div>';
    return;
  }
  document.getElementById('vocabGrid').innerHTML=vocab.map(v=>{
    const isFlipped=flippedCards[v.word];
    const cls=['flashcard'];
    if(isFlipped) cls.push('flipped');
    if(v.learned) cls.push('learned');
    return `<div class="${cls.join(' ')}" data-vocab="${encodeURIComponent(v.word)}">
      <div class="fc-word">${v.word}</div>
      <div class="fc-reveal">
        <div class="fc-meaning">${v.meaning}</div>
        ${v.example?`<div class="fc-example">${v.example}</div>`:''}
        <div class="fc-tags">
          <span class="fc-tag ${v.type}">${v.type==='travel'?'旅游':'葡萄酒'}</span>
          <span class="fc-tag learned-tag" data-mark="${encodeURIComponent(v.word)}" style="cursor:pointer;">
            ${v.learned?'✅ 已学':'标记已学'}
          </span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// 闪卡事件委托
document.getElementById('vocabGrid').addEventListener('click', function(e) {
  const card = e.target.closest('.flashcard');
  if (!card) return;
  if (e.target.closest('[data-mark]')) {
    const word = decodeURIComponent(e.target.closest('[data-mark]').dataset.mark);
    markVocabLearned(word);
    return;
  }
  const word = decodeURIComponent(card.dataset.vocab);
  toggleFlashcard(word);
});

function renderCalendar(containerId, monthKey, currentDate, dataObj, onSelectDate) {
  const y=Math.floor(monthKey/100), m=monthKey%100;
  const firstDay=new Date(y,m-1,1).getDay(); // 0=Sun
  const daysInMonth=new Date(y,m,0).getDate();
  const daysInPrevMonth=new Date(y,m-1,0).getDate();
  const today=todayStr();
  const weekDays=['日','一','二','三','四','五','六'];

  let html=`<div class="calendar-header">
    <button onclick="changeCalMonth('${containerId}',-1)">‹</button>
    <span class="cal-month">${y}年${m}月</span>
    <button onclick="changeCalMonth('${containerId}',1)">›</button>
  </div>`;
  html+='<div class="calendar-weekdays">'+weekDays.map(d=>`<span>${d}</span>`).join('')+'</div>';
  html+='<div class="calendar-days">';

  // 上月填充
  for(let i=firstDay-1;i>=0;i--) {
    const d=daysInPrevMonth-i;
    const ds=`${y}-${String(m-1||12).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    html+=`<div class="calendar-day other-month">${d}</div>`;
  }

  // 本月
  for(let d=1;d<=daysInMonth;d++) {
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===today;
    const isActive=ds===currentDate;
    const hasData=!!dataObj[ds];
    const cls=['calendar-day'];
    if(isToday) cls.push('today');
    if(isActive) cls.push('active-date');
    if(hasData) cls.push('has-data');
    html+=`<div class="${cls.join(' ')}" onclick="${onSelectDate}('${ds}')">${d}</div>`;
  }

  // 下月填充
  const remaining=(7-(firstDay+daysInMonth)%7)%7;
  for(let i=1;i<=remaining;i++) {
    html+=`<div class="calendar-day other-month">${i}</div>`;
  }

  html+='</div>';
  document.getElementById(containerId).innerHTML=html;
}

function changeCalMonth(containerId, dir) {
  if(containerId==='planCalendar') {
    let y=Math.floor(planCalMonth/100), m=planCalMonth%100;
    m+=dir; if(m>12){m=1;y++;}if(m<1){m=12;y--;}
    planCalMonth=y*100+m;
    renderPlanCalendar();
  } else {
    let y=Math.floor(diaryCalMonth/100), m=diaryCalMonth%100;
    m+=dir; if(m>12){m=1;y++;}if(m<1){m=12;y--;}
    diaryCalMonth=y*100+m;
    renderDiaryCalendar();
  }
}

function selectPlanDate(ds) {
  currentPlanDate=ds;
  planCalendarDate=ds;
  const y=parseInt(ds.slice(0,4)), m=parseInt(ds.slice(5,7));

function renderPlanCalendar() {

  if(!name){alert('请输入账户名称');return;}
  const amount=parseFloat(document.getElementById('acctAmount').value)||0;
  accountData.push({
    id:uid(),type:document.getElementById('acctType').value,name,amount,
    prevAmount:null,prevUpdated:null,updatedAt:todayStr(),
    notes:document.getElementById('acctNotes').value.trim()
  });
  saveAccounts();closeModal();renderFinance();
}
function updateAccountAmount(id){
  const a=accountData.find(x=>x.id===id);if(!a)return;
  const val=prompt(`更新「${a.name}」金额：\n上次记录：${fmtMoney(a.prevAmount||a.amount)}（${a.prevUpdated||a.updatedAt||'首次记录'}）\n请输入新金额：`,a.amount);
  if(val!==null){
    const newAmt=parseFloat(val)||0;
    a.prevAmount=a.amount;a.prevUpdated=a.updatedAt;a.amount=newAmt;a.updatedAt=todayStr();
    saveAccounts();renderFinance();
  }
}
function deleteAccount(id){if(!confirm('确定删除该账户？'))return;accountData=accountData.filter(a=>a.id!==id);saveAccounts();renderFinance();}

function openFundModal(){
  openModal('添加基金',`
    <div class="form-row">
      <div class="form-group"><label>基金名称</label><input type="text" id="fundName" placeholder="例：沪深300ETF"></div>
      <div class="form-group"><label>基金代码</label><input type="text" id="fundCode" placeholder="选填"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>买入金额（元）</label><input type="number" id="fundCost" placeholder="0.00" step="0.01"></div>
      <div class="form-group"><label>当前市值（元）</label><input type="number" id="fundCurrent" placeholder="0.00" step="0.01"></div>
    </div>
  `,`<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="submitFund()">保存</button>`);
}
function submitFund(){
  const name=document.getElementById('fundName').value.trim();
  if(!name){alert('请输入基金名称');return;}
  const cost=parseFloat(document.getElementById('fundCost').value)||0;
  const current=parseFloat(document.getElementById('fundCurrent').value)||0;
  fundData.push({id:uid(),name,code:document.getElementById('fundCode').value.trim(),cost,current,prevCurrent:null,updatedAt:todayStr()});
  saveFunds();closeModal();renderFinance();
}
function updateFundValue(id){
  const f=fundData.find(x=>x.id===id);if(!f)return;
  const val=prompt(`更新「${f.name}」当前市值：\n上次市值：${fmtMoney(f.prevCurrent||f.current)}（${f.updatedAt||'首次记录'}）\n请输入新市值：`,f.current);
  if(val!==null){
    const newVal=parseFloat(val)||0;
    f.prevCurrent=f.current;f.current=newVal;f.updatedAt=todayStr();
    saveFunds();renderFinance();
  }
}
function deleteFund(id){if(!confirm('确定删除该基金？'))return;fundData=fundData.filter(f=>f.id!==id);saveFunds();renderFinance();}

function renderFinance(){
  const accountTotal=accountData.reduce((s,a)=>s+a.amount,0);
  const fundCost=fundData.reduce((s,f)=>s+f.cost,0);
  const fundCurrent=fundData.reduce((s,f)=>s+f.current,0);
  const fundProfit=fundCurrent-fundCost;
  const totalAssets=accountTotal+fundCurrent;
  document.getElementById('financeStats').innerHTML=`
    <div class="stat-card"><div class="label">总资产</div><div class="value primary">${fmtMoney(totalAssets)}</div></div>
    <div class="stat-card"><div class="label">现金类账户</div><div class="value" style="color:var(--info);font-size:22px;font-weight:700;">${fmtMoney(accountTotal)}</div></div>
    <div class="stat-card"><div class="label">基金市值</div><div class="value" style="color:var(--warning);font-size:22px;font-weight:700;">${fmtMoney(fundCurrent)}</div></div>
    <div class="stat-card"><div class="label">基金盈亏</div><div class="value ${fundProfit>=0?'profit-positive':'profit-negative'}" style="${fundProfit<0?'color:var(--danger);':''}">${fundProfit>=0?'+':''}${fmtMoney(fundProfit)}</div></div>`;
  // 账户列表
  if(accountData.length===0){
    document.getElementById('accountList').innerHTML='<div class="empty"><div class="empty-icon">💰</div>还没有账户</div>';
  }else{
    document.getElementById('accountList').innerHTML=accountData.map(a=>{
      const change=a.prevAmount!==null?a.amount-a.prevAmount:0;
      return`
      <div class="asset-account">
        <div class="acct-info">
          <span class="acct-icon">${accountIcons[a.type]||'💳'}</span>
          <div>
            <div class="acct-name">${a.name}</div>
            <div class="acct-type">${a.type}${a.notes?' · '+a.notes:''}</div>
            <div class="acct-time">${a.prevAmount!==null?`上次：${fmtMoney(a.prevAmount)}（${a.prevUpdated}）→ 当前：${a.updatedAt}`:`记录于 ${a.updatedAt}`}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="text-align:right;">
            <div class="acct-amount" style="cursor:pointer;" title="点击更新" onclick="updateAccountAmount('${a.id}')">${fmtMoney(a.amount)}</div>
            ${a.prevAmount!==null?`<div class="acct-change" style="color:${change>=0?'var(--success)':'var(--danger)'};">${change>=0?'+':''}${fmtMoney(change)}</div>`:'<div class="acct-change" style="color:var(--text-light);">首次记录</div>'}
          </div>
          <button class="btn btn-outline btn-sm" onclick="updateAccountAmount('${a.id}')">更新</button>
          <button class="icon-btn" onclick="deleteAccount('${a.id}')">🗑️</button>
        </div>
      </div>`;
    }).join('');
  }
  // 基金表格
  if(fundData.length===0){
    document.getElementById('fundTableWrap').innerHTML='<div class="empty"><div class="empty-icon">📈</div>还没有基金记录</div>';
  }else{
    document.getElementById('fundTableWrap').innerHTML=`
      <table>
        <thead><tr><th>基金名称</th><th>代码</th><th>买入成本</th><th>当前市值</th><th>盈亏</th><th>收益率</th><th>更新时间</th><th>操作</th></tr></thead>
        <tbody>${fundData.map(f=>{
          const profit=f.current-f.cost;
          const rate=f.cost>0?(profit/f.cost*100):0;
          const chg=f.prevCurrent!==null?f.current-f.prevCurrent:null;
          return`
          <tr class="fund-row">
            <td><b>${f.name}</b></td><td style="color:var(--text-light);">${f.code||'-'}</td>
            <td>${fmtMoney(f.cost)}</td>
            <td>${fmtMoney(f.current)}${chg!==null?` <span style="font-size:11px;color:${chg>=0?'var(--success)':'var(--danger)'};">(${chg>=0?'+':''}${fmtMoney(chg)})</span>`:''}</td>
            <td class="${profit>=0?'profit-positive':'profit-negative'}">${profit>=0?'+':''}${fmtMoney(profit)}</td>
            <td class="${rate>=0?'profit-positive':'profit-negative'}">${rate>=0?'+':''}${rate.toFixed(2)}%</td>
            <td style="color:var(--text-light);font-size:12px;">${f.updatedAt}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="updateFundValue('${f.id}')">更新市值</button>
              <button class="btn btn-danger btn-sm" onclick="deleteFund('${f.id}')" style="margin-top:4px;">删除</button>
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table>
      <div style="margin-top:10px;font-size:13px;color:var(--text-light);">
        💡 点击「更新市值」输入新市值，系统自动记录变化；点击「删除」移除该基金
      </div>`;
  }
}

// ==================== 7. 文案备忘 ====================
function saveCopy(){DB.set('copywriting',copyData);}
function openCopyModal(){
  openModal('新建文案',`
    <div class="form-group"><label>文案内容</label><textarea id="copyContent" placeholder="在这里写文案..." style="min-height:160px;"></textarea></div>
    <div class="form-group"><label>备注（选填）</label><input type="text" id="copyNotes" placeholder="例如：配合周末活动使用、图片已准备好等"></div>
  `,`<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="submitCopy()">保存</button>`);
}
function submitCopy(){
  const content=document.getElementById('copyContent').value.trim();
  if(!content){alert('请输入文案内容');return;}
  copyData.unshift({id:uid(),content,notes:document.getElementById('copyNotes').value.trim(),published:false,publishedDate:null,createdAt:todayStr()});
  saveCopy();closeModal();renderCopywriting();
}
function publishCopy(id){const c=copyData.find(x=>x.id===id);if(c){c.published=true;c.publishedDate=todayStr();saveCopy();renderCopywriting();}}
function unpublishCopy(id){const c=copyData.find(x=>x.id===id);if(c){c.published=false;c.publishedDate=null;saveCopy();renderCopywriting();}}
function deleteCopy(id){if(!confirm('确定删除这条文案？'))return;copyData=copyData.filter(c=>c.id!==id);saveCopy();renderCopywriting();}
function renderCopywriting(){
  const unpub=copyData.filter(c=>!c.published);
  const pub=copyData.filter(c=>c.published);
  if(unpub.length===0) document.getElementById('copyUnpublished').innerHTML='<div class="empty"><div class="empty-icon">✍️</div>没有待发布的文案</div>';
  else document.getElementById('copyUnpublished').innerHTML=unpub.map(c=>`
    <div class="copy-card">
      <div class="copy-header">
        <span class="copy-type">📝 创建于 ${fmtDate(c.createdAt)}${c.notes?' · '+c.notes:''}</span>
        <button class="icon-btn" onclick="deleteCopy('${c.id}')">🗑️</button>
      </div>
      <div class="copy-content">${c.content}</div>
      <div class="copy-actions"><button class="btn btn-success btn-sm" onclick="publishCopy('${c.id}')">✓ 标记已发布</button></div>
    </div>`).join('');
  if(pub.length===0) document.getElementById('copyPublished').innerHTML='<div class="empty" style="padding:20px;"><div class="empty-icon">📂</div>还没有已发布的文案</div>';
  else document.getElementById('copyPublished').innerHTML=pub.map(c=>`
    <div class="copy-card published">
      <div class="copy-header">
        <span class="copy-type">✅ ${fmtDate(c.publishedDate)} 已发布 · ${fmtDate(c.createdAt)}创建</span>
        <button class="icon-btn" onclick="deleteCopy('${c.id}')">🗑️</button>
      </div>
      <div class="copy-content">${c.content}</div>
      <div class="copy-actions"><button class="btn btn-outline btn-sm" onclick="unpublishCopy('${c.id}')">↩ 取消发布</button></div>
    </div>`).join('');
}

// ==================== 数据导出/导入 ====================
function exportAllData() {
  const allData = {
    version: 1,
    exportedAt: new Date().toISOString(),
    todoData, vocabProgress,
    diaryData, salesData, studentData,
    accountData, fundData, copyData
  };
  const blob = new Blob([JSON.stringify(allData, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Penny工作台备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importAllData(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const allData = JSON.parse(ev.target.result);
      if(!allData.version) throw new Error('无效的备份文件');
      todoData = allData.todoData || {};
      vocabProgress = allData.vocabProgress || { dailyAssignments:{}, learnedWords:[] };
      diaryData = allData.diaryData || {};
      salesData = allData.salesData || [];
      studentData = allData.studentData || [];
      accountData = allData.accountData || [];
      fundData = allData.fundData || [];
      copyData = allData.copyData || [];
      saveAllData();
      refreshCurrentSection();
      alert('数据导入成功！');
    } catch(err) {
      alert('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function saveAllData() {
  DB.set('todos', todoData);
  DB.set('vocabProgress', vocabProgress);
  DB.set('diary', diaryData);
  DB.set('sales', salesData);
  DB.set('students', studentData);
  DB.set('accounts', accountData);
  DB.set('funds', fundData);
  DB.set('copywriting', copyData);
}
function refreshCurrentSection() {
  const activeSection = document.querySelector('.section.active')?.id || 'section-plan';
  const sec = activeSection.replace('section-','');
  const refreshMap = {
    'plan': renderTodos,
    'english': renderVocab,
    'diary': function(){renderDiary();},
    'sales': renderSales,
    'students': renderStudents,
    'finance': renderFinance,
    'copywriting': renderCopywriting
  };
  if(refreshMap[sec]) refreshMap[sec]();
}
